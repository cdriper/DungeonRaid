org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true
# Everything generated goes under build/ (one folder to ignore and to delete):
# Gradle's project cache (default .gradle/) and Kotlin's session data (default .kotlin/).
org.gradle.projectcachedir=build/.gradle
kotlin.project.persistent.dir=build/.kotlin
